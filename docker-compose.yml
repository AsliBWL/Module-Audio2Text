version: '3.8'

services:
  # Альтернативный сервис с поддержкой GPU NVIDIA
  # Для использования необходимо установить nvidia-docker2
  audio-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio2text-api-gpu
    ports:
      - "${API_PORT_GPU:-8001}:8000"
    volumes:
      - ./models:/app/models
      - ./cache:/root/.cache
      - ./output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    profiles:
      - gpu  # Используйте: docker-compose --profile gpu up

volumes:
  models:
  cache:
  output:

networks:
  default:
    name: audio2text-network
