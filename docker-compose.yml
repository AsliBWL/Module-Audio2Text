services:
  audio-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audio2text-api-gpu
    ports:
      - "${API_PORT_GPU:-8001}:8000"
    volumes:
      - ./models:/app/models
      - ./cache:/root/.cache
      - ./output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

